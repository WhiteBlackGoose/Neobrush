[package]
name = "neobrush"
version = "0.3.1-alpha"
edition = "2021"
description = "A modern, cross-platform raster graphics editor"
license = "MIT"
repository = "https://github.com/WhiteBlackGoose/Neobrush"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "neobrush"
path = "src/main.rs"

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp", "tga", "ico", "qoi"] }
rayon = "1"
ab_glyph = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
fontdb = { version = "0.23", default-features = false, features = ["std"] }
web-time = "1"
sys-locale = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
slint = { version = "1", default-features = false, features = ["accessibility"] }
rfd = "0.15"
arboard = { version = "3", features = ["wayland-data-control"] }
open = "5"
fontdb = { version = "0.23", features = ["fs", "memmap", "fontconfig"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlInputElement", "FileList", "File", "Blob", "BlobPropertyBag", "Url", "Storage", "Event", "console"] }
console_error_panic_hook = "0.1"

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
maintainer = "WhiteBlackGoose <wbg@angouri.org>"
section = "graphics"
priority = "optional"
extended-description = "Neobrush is a fast raster graphics editor in the spirit of Paint.NET with layers, selections, adjustments, effects and a theme that follows the system."
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libfontconfig1, libgl1, libwayland-client0, libx11-6, libxcursor1, libxrandr2, libxi6"
assets = [
    ["target/release/neobrush", "usr/bin/", "755"],
    ["packaging/neobrush.desktop", "usr/share/applications/", "644"],
    ["packaging/neobrush.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/icons/neobrush-256.png", "usr/share/icons/hicolor/256x256/apps/neobrush.png", "644"],
    ["README.md", "usr/share/doc/neobrush/", "644"],
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

[profile.web]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
