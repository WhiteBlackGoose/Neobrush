name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            bin: neobrush
          - os: windows-latest
            name: windows-x86_64
            bin: neobrush.exe
          - os: macos-latest
            name: macos-arm64
            bin: neobrush
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: neobrush-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust pkgconf fontconfig libxkbcommon wayland libX11 libXcursor libXrandr libXi mesa-libs
          run: |
            cargo test --release
            cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: neobrush-freebsd-x86_64
          path: target/release/neobrush
